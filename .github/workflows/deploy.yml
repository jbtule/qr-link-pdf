# Builds the browser app and deploys it across two hosts:
#
#   GitHub Pages  - index.html, css, and the ~50 KB Blazor bootstrap (~65 KB)
#   Cloudflare    - the .NET runtime (Tesseract statically linked in - see
#                   QrLinkPdf.Wasm.fsproj), PDFium, Skia and every assembly
#                   (~27 MB), plus the OCR checkbox's English trained data
#                   (~4 MB), fetched on demand only when it's used
#
# The split exists because GitHub Pages only gzips and has a 100 GB/month soft
# bandwidth limit, while Cloudflare serves static assets with brotli/zstd and no
# cap. index.html redirects the heavy boot resources with Blazor's
# loadBootResource hook, so the page keeps its tools.tuley.name/qr-link-pdf URL.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys interleave: the shell references fingerprinted asset
# names, so it must not go live before its matching assets.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Where the runtime is served from. Must end in a slash. Change this if the
  # Cloudflare Pages project or its custom domain changes.
  ASSET_BASE: https://qr-link-pdf.asset-data.stream/
  # GitHub Pages serves project sites under /<repo>/.
  BASE_HREF: /qr-link-pdf/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.fsproj'

      # PDFium and Skia are Emscripten static archives that get linked into
      # dotnet.wasm, so the native toolchain is required.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      # English trained data for OCR - fetched once here, ahead of Test:
      # QrLinkPdf.Tests/OcrTests.fs runs real TesseractEngine OCR (not the
      # fake-engine tests elsewhere in the suite) and fails loudly, not
      # skips, if this is missing - see its own comment for why. Same file
      # the CLI's own --ocr yes needs locally (README), not checked in.
      - name: Fetch OCR trained data
        run: |
          set -euo pipefail
          mkdir -p tessdata
          curl -sL -o tessdata/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata

      - name: Test
        run: dotnet test QrLinkPdf.Tests/QrLinkPdf.Tests.fsproj --configuration Release

      # Gate the deploy on the library actually working under WebAssembly.
      # A normal test run uses the desktop native libraries and would not
      # catch a broken Emscripten link.
      - name: Smoke test WebAssembly
        run: ./smoke-wasm.sh

      # Tesseract itself is statically linked into dotnet.wasm at publish
      # time (see QrLinkPdf.Wasm.fsproj's Tesseract.Native.browser-wasm
      # reference via Core) - the trained data fetched above is the only OCR
      # asset the browser still needs separately. Placed in wwwroot before
      # Publish so it's picked up as a static web asset the same way
      # app.css/download.js already are.
      - name: Copy OCR trained data into the browser app
        run: |
          set -euo pipefail
          mkdir -p QrLinkPdf.Wasm/wwwroot/tessdata
          cp tessdata/eng.traineddata QrLinkPdf.Wasm/wwwroot/tessdata/

      # No .br/.gz: Cloudflare compresses on the fly and GitHub Pages can't
      # serve precompressed files anyway. Saves ~20 MB per deploy.
      - name: Publish
        run: >
          dotnet publish QrLinkPdf.Wasm/QrLinkPdf.Wasm.fsproj
          --configuration Release
          -p:CompressionEnabled=false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Gate the deploy on OCR actually working end to end in a real
      # browser - uploads smoke-wasm-ocr/fixture.pdf, enables the checkbox,
      # and checks both that OCR found the real URL and that Blazor's
      # global error banner never showed up. Neither Smoke test WebAssembly
      # above (no OCR at all) nor a plain dotnet test (desktop native
      # libraries, not the wasm build) would catch the class of bug this
      # exists for - see smoke-wasm-ocr.sh's own comment.
      - name: Smoke test WebAssembly OCR
        run: ./smoke-wasm-ocr.sh

      - name: Split the output across the two hosts
        run: |
          set -euo pipefail
          pub=QrLinkPdf.Wasm/bin/Release/net10.0-browser/publish/wwwroot
          mkdir -p shell/_framework assets/_framework

          cp "$pub/app.css" "$pub/download.js" shell/
          # Icons/manifest need to be same-origin with the page - iOS reads
          # apple-touch-icon.png relative to the page it's added from, and a
          # browser's favicon/manifest requests are same-origin by default.
          cp "$pub"/favicon.* "$pub/apple-touch-icon.png" "$pub/icon-192.png" "$pub/icon-512.png" \
             "$pub/manifest.webmanifest" shell/
          # The bootstrap script is loaded by a <script> tag, not by
          # loadBootResource, so it has to sit next to the page.
          cp "$pub"/_framework/blazor.webassembly*.js shell/_framework/

          cp -R "$pub"/_framework/. assets/_framework/
          rm -f assets/_framework/blazor.webassembly*.js

          # Ocr.fs resolves this relative to qrLinkPdfGetAssetBase() itself
          # (see its own comment), so it goes on the asset host, not the
          # shell.
          cp -R "$pub/tessdata" assets/

          # Stamp the footer badge with the commit being deployed. Falls back
          # to the committed "dev" defaults when GITHUB_SHA is unset, which is
          # how ci-local.sh replays this step.
          short=dev
          commit=commits/main
          if [ -n "${GITHUB_SHA:-}" ]; then
            short=$(printf %.7s "$GITHUB_SHA")
            commit="commit/$GITHUB_SHA"
          fi

          # Point the page at its real base path and at the asset host.
          # Written out rather than edited in place, so this step behaves the
          # same on a Mac as on the runner and can be dry-run locally.
          sed -e "s|<base href=\"/\" />|<base href=\"${BASE_HREF}\" />|" \
              -e "s|window.qrLinkPdfAssetBase = \"\";|window.qrLinkPdfAssetBase = \"${ASSET_BASE}\";|" \
              -e "s|window.qrLinkPdfBuildVersion = \"dev\";|window.qrLinkPdfBuildVersion = \"${short}\";|" \
              -e "s|?v=dev|?v=${short}|g" \
              -e "s|badge/build-dev-inactive|badge/build-${short}-007ec6|" \
              -e "s|qr-link-pdf/commits/main|qr-link-pdf/${commit}|" \
              "$pub/index.html" > shell/index.html

          # A sed that silently stops matching would ship a page claiming the
          # wrong base path, asset host, build, or - worst of all silently -
          # still pointing at unbusted URLs that ride GitHub Pages' cache.
          grep -q "${BASE_HREF}" shell/index.html
          grep -q "${ASSET_BASE}" shell/index.html
          grep -q "window.qrLinkPdfBuildVersion = \"${short}\";" shell/index.html
          # Only real deploys (GITHUB_SHA set, short != dev) need this - the
          # ci-local.sh replay's "dev" fallback legitimately leaves ?v=dev in
          # place, since short *is* "dev" there.
          if [ "$short" != dev ]; then
            ! grep -q "?v=dev" shell/index.html
          fi
          grep -q "badge/build-${short}-" shell/index.html
          grep -q "qr-link-pdf/${commit}" shell/index.html

          # Cross-origin fetches need this or the runtime never loads. Blazor
          # also verifies asset integrity, which requires a non-opaque
          # response. Ocr.fs's HttpClient fetch of tessdata needs it too.
          cat > assets/_headers <<EOF
          /_framework/*
            Access-Control-Allow-Origin: https://tools.tuley.name
          /tessdata/*
            Access-Control-Allow-Origin: https://tools.tuley.name
          EOF

          echo "shell:  $(du -sh shell | cut -f1)"
          echo "assets: $(du -sh assets | cut -f1)"

      - uses: actions/upload-artifact@v7
        with:
          name: assets
          path: assets
          retention-days: 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: shell

  # Assets go first: the shell is useless until the runtime it points at exists.
  assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: assets

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy assets --project-name=qr-link-pdf-assets --branch=main

  pages:
    needs: assets
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
