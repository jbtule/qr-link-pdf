<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qr-link-pdf</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css?v=dev" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest?v=dev" />
    <meta name="theme-color" content="#364757" />
</head>

<body>
    <div id="main">
        <p class="booting">Loading the .NET runtime...</p>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. <a href="." class="reload">Reload</a>
    </div>

    <!-- Outside #main on purpose: that element is Bolero's root and gets
         replaced when the runtime boots, so a footer inside it would vanish
         and come back. Out here it shows during the several seconds the
         runtime takes to load.

         The build badge says "dev" until the deploy workflow rewrites it with
         the commit it shipped - a local build genuinely isn't a release. -->
    <footer class="badges">
        <a href="https://github.com/jbtule/qr-link-pdf" title="Source on GitHub">
            <img src="https://img.shields.io/badge/github-jbtule%2Fqr--link--pdf-555?logo=github&logoColor=white"
                alt="Source on GitHub" height="20" />
        </a>
        <a href="https://github.com/jbtule/qr-link-pdf/commits/main" title="The commit this page was built from">
            <img src="https://img.shields.io/badge/build-dev-inactive" alt="Build" height="20" />
        </a>
        <a href="https://github.com/jbtule/qr-link-pdf/blob/main/LICENSE" title="Licence">
            <img src="https://img.shields.io/badge/license-AGPL--3.0-2f5d3f" alt="Licence: AGPL-3.0" height="20" />
        </a>
    </footer>

    <script>
        // Origin serving the .NET runtime and assemblies. Empty means "same
        // origin", which is what a local `dotnet run` wants. The deploy
        // workflow rewrites this to the CDN, because the page itself is on
        // GitHub Pages - which only gzips, and has a bandwidth budget - while
        // the ~25 MB of runtime is better off somewhere with brotli and no cap.
        window.qrLinkPdfAssetBase = "";
        // Ocr.fs reads this through JS interop (IJSInProcessRuntime, which
        // it already needs to be synchronous) to fetch eng.traineddata from
        // the same host as everything else - same convention as
        // loadBootResource below, just exposed as a callable function since
        // interop invokes by name, not by reading a global directly. Falls
        // back to the page's own base (document.baseURI, not "") because
        // .NET's HttpClient needs an absolute BaseAddress, unlike a bare
        // relative fetch() URL.
        window.qrLinkPdfGetAssetBase = function () { return window.qrLinkPdfAssetBase || document.baseURI; };
        // The commit this page was built from - rewritten by the deploy
        // workflow, same as the build badge below. Every same-origin file
        // that isn't itself fingerprinted (app.css, download.js, ocr.js,
        // blazor.webassembly.js, dotnet.js - unlike the assemblies, which
        // Blazor names by content hash on its own) gets this appended as a
        // cache-busting query string, so a new deploy is a genuinely new
        // URL instead of relying on GitHub Pages'/Cloudflare's own caching
        // (which browsers can and do hold onto well past what a fresh page
        // around it would suggest - confirmed the hard way: the shell had
        // visibly updated - a fresh build badge - while the page still ran
        // stale logic underneath).
        window.qrLinkPdfBuildVersion = "dev";
    </script>
    <script src="download.js?v=dev"></script>
    <script src="_framework/blazor.webassembly.js?v=dev" autostart="false"></script>
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                var base = window.qrLinkPdfAssetBase;
                var v = window.qrLinkPdfBuildVersion;

                if (type === 'dotnetjs') {
                    // dotnet.js is the one boot resource whose own content
                    // embeds the resource manifest - every other assembly's
                    // fingerprinted filename - since it's the very first
                    // thing loaded, before any manifest exists to look a
                    // hash up from, .NET can't fingerprint it the way it
                    // does everything else. That makes it the single most
                    // important thing to cache-bust here: a stale cached
                    // copy keeps the whole app pinned to an old manifest -
                    // and therefore old assemblies - no matter how fresh
                    // the page around it is. Busted with our own query
                    // string rather than left to the (unhashed) filename
                    // Blazor resolved, on top of whichever origin it's
                    // coming from.
                    var url = base ? base + defaultUri.substring(defaultUri.indexOf('_framework/')) : defaultUri;
                    return url + '?v=' + v;
                }

                if (!base) {
                    return null; // same origin, default loading
                }

                switch (type) {
                    case 'dotnetwasm':
                    case 'timezonedata':
                    case 'assembly':
                    case 'pdb':
                        // Keep whatever fingerprinted filename Blazor resolved
                        // and only swap the origin, so cache-busting still works.
                        var index = defaultUri.indexOf('_framework/');
                        return index < 0 ? null : base + defaultUri.substring(index);
                    default:
                        return null;
                }
            }
        });
    </script>
</body>

</html>
